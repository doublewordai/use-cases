[project]
name = "agent-migration"
version = "0.1.0"
description = "Migrate an agent from a flagship to an open-weight model, evaluated on Doubleword"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase 1 and Phase 3 can trace live calls to a self-hosted Phoenix.
phoenix = [
    "arize-phoenix>=4.0",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-openai>=0.1",
]

[project.scripts]
agent-migration = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
